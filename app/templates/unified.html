<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta id="bootstrap-api-key" content="{{ api_key }}">
<title>DeepLive VOIP Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg-primary:#0a0e1a;--bg-secondary:#0f1525;--bg-tertiary:#141b2d;--bg-card:#111827;--border-color:#1e293b;--border-hover:#334155;--text-primary:#e2e8f0;--text-secondary:#94a3b8;--text-muted:#64748b;--accent-cyan:#06b6d4;--accent-cyan-glow:rgba(6,182,212,0.3);--accent-green:#10b981;--accent-green-glow:rgba(16,185,129,0.3);--accent-yellow:#f59e0b;--accent-red:#ef4444;--accent-purple:#8b5cf6;--font-mono:'JetBrains Mono',monospace;--font-sans:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{height:100%;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-sans);overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg-secondary)}
::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-hover)}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 5px var(--accent-cyan-glow)}50%{box-shadow:0 0 20px var(--accent-cyan-glow),0 0 40px var(--accent-cyan-glow)}}
@keyframes pulse-green{0%,100%{box-shadow:0 0 5px var(--accent-green-glow)}50%{box-shadow:0 0 20px var(--accent-green-glow),0 0 40px var(--accent-green-glow)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes slide-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes marker-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:0.5}}
@keyframes progress-shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.cyber-grid{background-image:linear-gradient(rgba(6,182,212,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(6,182,212,0.03) 1px,transparent 1px);background-size:40px 40px}
.glass-panel{background:rgba(17,24,39,0.7);backdrop-filter:blur(12px);border:1px solid var(--border-color);border-radius:8px}
.neon-border{border:1px solid rgba(6,182,212,0.3);box-shadow:inset 0 0 20px rgba(6,182,212,0.05),0 0 10px rgba(6,182,212,0.1)}
.status-active{animation:pulse-glow 2s infinite}
.status-complete{border-color:var(--accent-green);animation:pulse-green 2s infinite}
.progress-bar-fill{background:linear-gradient(90deg,var(--accent-cyan),var(--accent-green));background-size:200% 100%;animation:progress-shimmer 2s linear infinite;transition:width 0.5s ease}
.terminal-cursor::after{content:'▋';animation:blink 1s infinite;color:var(--accent-cyan);margin-left:2px}
.packet-row{transition:background 0.2s;font-family:var(--font-mono);font-size:12px;cursor:pointer}
.packet-row:hover{background:rgba(6,182,212,0.05)}
.packet-row.selected{background:rgba(6,182,212,0.15);color:var(--accent-cyan)}
.packet-row:nth-child(even){background:rgba(255,255,255,0.02)}
.packet-row:nth-child(even):hover{background:rgba(6,182,212,0.05)}
.map-marker{width:12px;height:12px;background:var(--accent-cyan);border-radius:50%;position:relative;animation:marker-pulse 2s infinite;z-index:2;box-shadow:0 0 10px var(--accent-cyan)}
.map-marker::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border:1px solid var(--accent-cyan);border-radius:50%;animation:marker-pulse 2s infinite 0.5s}
.map-marker-pulse{width:12px;height:12px;background:var(--accent-cyan);border-radius:50%;position:relative;animation:marker-pulse 2s infinite;z-index:2;box-shadow:0 0 10px var(--accent-cyan)}
.map-marker-pulse::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;border:1px solid var(--accent-cyan);border-radius:50%;animation:marker-pulse 2s infinite 0.5s}
.leaflet-container { font-family: var(--font-sans) !important; background: #0b0e1a !important; }
.leaflet-bar { border: 1px solid var(--border-color) !important; background-color: var(--bg-secondary) !important; box-shadow: none !important; }
.leaflet-bar a { background-color: var(--bg-secondary) !important; color: var(--text-primary) !important; border-bottom: 1px solid var(--border-color) !important; }
.leaflet-bar a:hover { background-color: var(--bg-tertiary) !important; color: var(--accent-cyan) !important; }
.leaflet-popup-content-wrapper { background: rgba(17, 24, 39, 0.95) !important; backdrop-filter: blur(8px); border: 1px solid var(--accent-cyan) !important; color: var(--text-primary) !important; border-radius: 6px !important; box-shadow: 0 0 15px rgba(6, 182, 212, 0.15) !important; }
.leaflet-popup-tip { background: rgba(17, 24, 39, 0.95) !important; border-left: 1px solid var(--accent-cyan) !important; border-bottom: 1px solid var(--accent-cyan) !important; }
.map-grid{background-image:linear-gradient(rgba(6,182,212,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(6,182,212,0.08) 1px,transparent 1px);background-size:30px 30px;position:relative;overflow:hidden}
.stat-card{padding:16px;border:1px solid var(--border-color);border-radius:6px;background:var(--bg-card);transition:all 0.3s ease}
.stat-card:hover{border-color:var(--accent-cyan);transform:translateY(-2px)}
.stat-value{font-family:var(--font-mono);font-size:24px;font-weight:700;color:var(--accent-cyan);line-height:1}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-top:8px}
.stat-unit{font-size:12px;color:var(--text-secondary);margin-left:4px}
.btn-cyber{padding:10px 24px;background:transparent;border:1px solid var(--accent-cyan);color:var(--accent-cyan);font-family:var(--font-mono);font-size:13px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;border-radius:4px;transition:all 0.3s ease;display:inline-flex;align-items:center;gap:8px}
.btn-cyber:hover{background:rgba(6,182,212,0.1);box-shadow:0 0 20px rgba(6,182,212,0.3)}
.btn-cyber:active{transform:scale(0.98)}
.btn-cyber.recording{border-color:var(--accent-red);color:var(--accent-red);animation:pulse-glow 2s infinite}
.btn-cyber.paused{border-color:var(--accent-yellow);color:var(--accent-yellow)}
.btn-cyber-secondary{padding:8px 16px;background:transparent;border:1px solid var(--border-color);color:var(--text-secondary);font-family:var(--font-mono);font-size:12px;cursor:pointer;border-radius:4px;transition:all 0.3s ease}
.btn-cyber-secondary:hover{border-color:var(--accent-cyan);color:var(--accent-cyan)}
.badge{padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.badge-medium{background:rgba(245,158,11,0.15);color:var(--accent-yellow);border:1px solid rgba(245,158,11,0.3)}
.badge-high{background:rgba(239,68,68,0.15);color:var(--accent-red);border:1px solid rgba(239,68,68,0.3)}
.badge-low{background:rgba(16,185,129,0.15);color:var(--accent-green);border:1px solid rgba(16,185,129,0.3)}
.badge-clean{background:rgba(100,116,139,0.15);color:var(--text-muted);border:1px solid var(--border-color)}
.nav-item{padding:12px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.2s ease;border-left:3px solid transparent;color:var(--text-secondary);font-size:14px}
.nav-item:hover{background:rgba(6,182,212,0.05);color:var(--text-primary)}
.nav-item.active{background:rgba(6,182,212,0.08);border-left-color:var(--accent-cyan);color:var(--accent-cyan)}
.nav-icon{width:18px;height:18px;opacity:0.7}
.nav-item.active .nav-icon{opacity:1}
.section-title{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.section-title::after{content:'';flex:1;height:1px;background:var(--border-color);margin-left:12px}
.intel-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-color);font-size:13px}
.intel-row:last-child{border-bottom:none}
.intel-label{color:var(--text-muted);font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.intel-value{color:var(--text-primary);font-family:var(--font-mono);font-weight:500;font-size:12px;text-align:right}
.intel-value.highlight{color:var(--accent-cyan)}
.intel-value.warning{color:var(--accent-yellow)}
.intel-value.danger{color:var(--accent-red)}
.intel-value.success{color:var(--accent-green)}
.log-entry{font-family:var(--font-mono);font-size:12px;line-height:1.6;padding:2px 0;opacity:0;animation:slide-in 0.3s ease forwards}
.log-time{color:var(--text-muted);margin-right:8px}
.capture-card{padding:16px;border:1px solid var(--border-color);border-radius:6px;background:var(--bg-card);transition:all 0.5s ease;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.capture-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent-cyan);transform:scaleX(0);transform-origin:left;transition:transform 0.5s ease}
.capture-card.active::before{transform:scaleX(1)}
.capture-card.complete::before{background:var(--accent-green);transform:scaleX(1)}
.capture-card.active{border-color:var(--accent-cyan);animation:pulse-glow 2s infinite}
.capture-card.complete{border-color:var(--accent-green)}
.capture-card-number{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-bottom:8px}
.capture-card-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.check-icon{width:16px;height:16px;border-radius:50%;border:1px solid var(--border-color);display:flex;align-items:center;justify-content:center;font-size:10px;transition:all 0.3s ease;flex-shrink:0}
.check-icon.active{border-color:var(--accent-cyan);color:var(--accent-cyan)}
.check-icon.complete{border-color:var(--accent-green);background:var(--accent-green);color:var(--bg-primary)}
.dashboard-card{padding:16px;border:1px solid var(--border-color);border-radius:6px;background:var(--bg-card);text-align:center;transition:all 0.3s ease}
.dashboard-card:hover{border-color:var(--accent-cyan)}
.dashboard-card-value{font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--accent-cyan);line-height:1}
.dashboard-card-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-top:8px}
.dashboard-card.active .dashboard-card-value{color:var(--accent-green)}
.table-row-hover:hover{background:rgba(6,182,212,0.05)}
.table-row-alt{background:rgba(255,255,255,0.02)}
.input-cyber{background:var(--bg-card);border:1px solid var(--border-color);border-radius:4px;padding:8px 12px;color:var(--text-primary);font-family:var(--font-mono);font-size:13px;outline:none;transition:all 0.3s ease;width:100%}
.input-cyber:focus{border-color:var(--accent-cyan);box-shadow:0 0 10px rgba(6,182,212,0.2)}
.toggle-switch{width:40px;height:20px;background:var(--border-color);border-radius:10px;position:relative;cursor:pointer;transition:all 0.3s ease}
.toggle-switch.active{background:var(--accent-cyan)}
.toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--text-primary);border-radius:50%;transition:all 0.3s ease}
.toggle-switch.active::after{left:22px}
.decoder-node{padding:8px 12px;border-left:2px solid var(--border-color);margin-left:8px}
.decoder-node.active{border-left-color:var(--accent-cyan);background:rgba(6,182,212,0.05)}
.decoder-field{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border-color);font-size:11px}
.decoder-field:last-child{border-bottom:none}
.ip-box{padding:12px;background:rgba(6,182,212,0.05);border:1px solid rgba(6,182,212,0.3);border-radius:6px;margin-bottom:12px;text-align:center}
.ip-box-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:4px}
.ip-box-value{font-size:18px;font-family:var(--font-mono);font-weight:700;color:var(--accent-cyan)}
.spinner{width:14px;height:14px;border:2px solid var(--border-color);border-top-color:var(--accent-cyan);border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block}
#app-toast{position:fixed;bottom:24px;right:24px;background:rgba(17,24,39,0.95);border:1px solid var(--accent-cyan);color:var(--text-primary);padding:12px 20px;border-radius:8px;font-family:var(--font-mono);font-size:13px;z-index:99999;box-shadow:0 0 20px rgba(6,182,212,0.3);max-width:400px;transition:opacity 0.3s,transform 0.3s;opacity:0;transform:translateY(10px);pointer-events:none}
#app-toast.show{opacity:1;transform:translateY(0)}
#app-toast.error{border-color:var(--accent-red);box-shadow:0 0 20px rgba(239,68,68,0.3)}
.btn-filter-preset{padding:3px 6px;border-radius:3px;font-family:var(--font-mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;transition:all 0.2s ease;background:rgba(15,23,42,0.6);color:var(--text-secondary);border:1px solid rgba(6,182,212,0.15);outline:none}
.btn-filter-preset:hover:not(:disabled){border-color:var(--accent-cyan);color:var(--text-primary)}
.btn-filter-preset.active{background:rgba(6,182,212,0.15);color:var(--accent-cyan);border-color:var(--accent-cyan);box-shadow:0 0 10px rgba(6,182,212,0.2)}
.btn-filter-preset:disabled{opacity:0.4;cursor:not-allowed}
</style>
</head>
<body>
<div id="root"></div>
<div id="app-toast"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
(function(){
'use strict';
const { useState, useEffect, useRef, useCallback, useMemo, Fragment } = React;
function h(type,props,...children){return React.createElement(type,props,...children)}

const API_BASE = window.location.origin;
const _metaKey = document.getElementById('bootstrap-api-key');
const BOOTSTRAP_API_KEY = _metaKey ? _metaKey.getAttribute('content') : '';
function getKey(){
  let k = localStorage.getItem('wirestream_api_key');
  if (BOOTSTRAP_API_KEY && !BOOTSTRAP_API_KEY.startsWith('{') && k !== BOOTSTRAP_API_KEY) {
    localStorage.setItem('wirestream_api_key', BOOTSTRAP_API_KEY);
    k = BOOTSTRAP_API_KEY;
  }
  return k || '';
}
function setKey(k){localStorage.setItem('wirestream_api_key',k);}


let _toastTm=null;
function toast(msg,type='info'){
  const el=document.getElementById('app-toast');
  if(!el) return;
  el.textContent=msg;
  el.className='show '+(type==='error'?'error':type==='success'?'success':'');
  if(_toastTm)clearTimeout(_toastTm);
  _toastTm=setTimeout(()=>{el.className='';},4200);
}

async function api(path,opts={}){
  const k=getKey();
  const headers={'Content-Type':'application/json',...(k?{'Authorization':'Bearer '+k}:{}),...(opts.headers||{})};
  const r=await fetch(API_BASE+path,{...opts,headers});
  if(!r.ok){const t=await r.text().catch(()=>'');throw new Error('HTTP '+r.status+' '+t.slice(0,120));}
  return r.json();
}

async function apiBlob(path){
  const k=getKey();
  const r=await fetch(API_BASE+path,{headers:k?{'Authorization':'Bearer '+k}:{}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.blob();
}

// Icons
function IconActivity(){return h('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},h('path',{d:'M22 12h-4l-3 9L9 3l-3 9H2'}))}
function IconRadio(){return h('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},h('circle',{cx:12,cy:12,r:2}),h('path',{d:'M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14'}))}
function IconSearch(){return h('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},h('circle',{cx:11,cy:11,r:8}),h('path',{d:'m21 21-4.35-4.35'}))}
function IconFileText(){return h('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},h('path',{d:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'}),h('polyline',{points:'14 2 14 8 20 8'}),h('line',{x1:16,y1:13,x2:8,y2:13}),h('line',{x1:16,y1:17,x2:8,y2:17}))}
function IconShield(){return h('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},h('path',{d:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'}))}
function IconSettings(){return h('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},h('circle',{cx:12,cy:12,r:3}),h('path',{d:'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z'}))}
function IconPlay(){return h('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'currentColor'},h('polygon',{points:'5 3 19 12 5 21 5 3'}))}
function IconSquare(){return h('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'currentColor'},h('rect',{x:3,y:3,width:18,height:18,rx:2}))}
function IconPause(){return h('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'currentColor'},h('rect',{x:6,y:4,width:4,height:16}),h('rect',{x:14,y:4,width:4,height:16}))}
function IconResume(){return h('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'currentColor'},h('polygon',{points:'5 3 19 12 5 21 5 3'}))}
function IconCheck(){return h('svg',{width:10,height:10,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:3},h('polyline',{points:'20 6 9 17 4 12'}))}
function IconGlobe(){return h('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},h('circle',{cx:12,cy:12,r:10}),h('line',{x1:2,y1:12,x2:22,y2:12}),h('path',{d:'M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z'}))}
function IconWifi(){return h('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},h('path',{d:'M5 12.55a11 11 0 0 1 14.08 0'}),h('path',{d:'M1.42 9a16 16 0 0 1 21.16 0'}),h('path',{d:'M8.53 16.11a6 6 0 0 1 6.95 0'}),h('line',{x1:12,y1:20,x2:12.01,y2:20}))}

function getPacketDetails(pkt) {
  if(!pkt) return null;
  return [
    {name:'Frame', fields:[{k:'Size', v:pkt.len+' bytes'}, {k:'Time', v:pkt.time}, {k:'Number', v:pkt.id}]},

}

function GeoPanel(props){
  const {profile, isCapturing}=props;
  const mapRef = useRef(null);

  useEffect(function(){
    if (isCapturing || !profile || !profile.ip || !mapRef.current) {
      return;
    }

    const lat = parseFloat(profile.lat) || 0;
    const lon = parseFloat(profile.lon) || 0;

    const map = L.map(mapRef.current, { zoomControl: false }).setView([lat, lon], 10);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);
    
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Accuracy Precision Circle representation
    L.circle([lat, lon], {
      color: '#06b6d4',
      fillColor: '#06b6d4',
      fillOpacity: 0.15,
      weight: 1,
      radius: 6000 // 6km precision radius
    }).addTo(map);

    const pulseIcon = L.divIcon({
      className: 'custom-div-icon',
      html: "<div class='map-marker-pulse'></div>",

function ASNMapper(props) {
  const { profile, activeIPs, selectedIP, setSelectedIP } = props;

  const rows = useMemo(function() {
    const list = [...(activeIPs || [])];
    if (profile && profile.ip && !list.some(function(x){ return x.ip === profile.ip; })) {
      list.unshift({
        ip: profile.ip,
        asn: profile.asn || '—',
        org: profile.isp || profile.org || '—',
        city: profile.city || '',
        country: profile.country || '',
        state: profile.state || '',
        lat: profile.lat || 0,
        lon: profile.lon || 0,
        isp: profile.isp || ''
      });
    }
    return list;
  }, [profile, activeIPs]);

  const currentSelection = useMemo(function() {
    const target = selectedIP || (profile && profile.ip);
    if (!target) return null;
    const found = rows.find(function(x) { return x.ip === target; });
    if (found) return found;
    return {
      ip: profile.ip,
      asn: profile.asn || '—',
      org: profile.isp || profile.org || '—',
      city: profile.city || '',
      country: profile.country || '',

function PacketDecoderPage(props) {
  const { packets, uploadResult } = props;
  const [selectedPkt, setSelectedPkt] = useState(null);

  const list = useMemo(() => {
    if (uploadResult && uploadResult.packet_rows && uploadResult.packet_rows.length > 0) {
      return uploadResult.packet_rows.map((p, i) => ({
        id: i + 1,
        time: p.timestamp || '',
        src: p.source_ip + (p.source_port ? ':' + p.source_port : ''),
        dst: p.destination_ip + (p.destination_port ? ':' + p.destination_port : ''),
        proto: p.protocol || '',
        len: p.length || 0,
        info: p.decoded_summary || p.summary || '',
        _raw: p
      }));
    }
    if (packets && packets.length > 0) {
      return packets.map((p, i) => ({
        id: p.num || (i + 1),
        time: p.time || '',
        src: p.src || '',
        dst: p.dst || '',
        proto: p.proto || '',
        len: p.len || 0,
        info: p.info || '',
        _raw: null
      }));
    }
    return [];
  }, [packets, uploadResult]);

  useEffect(() => {
    if (list.length > 0) setSelectedPkt(list[0]);
  }, [list]);

  const details = useMemo(() => {
    if (!selectedPkt) return null;
    if (selectedPkt._raw) {
      const raw = selectedPkt._raw;
      const layers = [
        { name: 'Frame', fields: [ { k: 'Number', v: String(selectedPkt.id) }, { k: 'Time', v: selectedPkt.time }, { k: 'Size', v: String(selectedPkt.len) + ' bytes' } ] },

        layers.push({ name: 'Transport Layer', fields: [ { k: 'Source Port', v: String(raw.source_port || '') }, { k: 'Destination Port', v: String(raw.destination_port || '') }, { k: 'TCP Flags', v: raw.tcp_flags || '—' } ] });

      h('div', { style: { fontSize: '11px', color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '3px', marginLeft: '28px' } }, 'Deep packet inspection and protocol layer analysis')
    ),
    list.length === 0 ?
      h('div', { className: 'glass-panel neon-border', style: { padding: '48px', textAlign: 'center', fontFamily: 'var(--font-mono)', color: 'var(--text-muted)' } }, 'No packets decoded. Start a capture session or upload a PCAP file to begin decoding.') :
      h('div', { style: { flex: 1, minHeight: 0, display: 'grid', gridTemplateColumns: '1.5fr 1fr', gap: '16px' } },
        h('div', { className: 'glass-panel', style: { display: 'flex', flexDirection: 'column', overflow: 'hidden' } },

            h('thead', { style: { position: 'sticky', top: 0, background: 'var(--bg-card)' } }, h('tr', { style: { color: 'var(--text-muted)', textAlign: 'left' } },

function UploadPage(props) {
  const { onUploadResult } = props;
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(null);
  const ref = useRef(null);

  async function handleFiles(files) {
    if (!files || !files.length) return;
    setBusy(true); setDone(null);
    try {
      const fd = new FormData();
      for (const f of files) fd.append('files', f);
      const k = getKey();
      const r = await fetch(API_BASE + '/api/upload', { method: 'POST', headers: k ? { 'Authorization': 'Bearer ' + k } : {}, body: fd });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      setDone(d);
      onUploadResult(d);
      toast('PCAP parsed and loaded successfully!', 'success');
    } catch (e) {
      toast('Upload failed: ' + e.message, 'error');
    } finally {
      setBusy(false);
    }
  }

  return h('div', { style: { height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' } },
    h('div', { className: 'glass-panel neon-border', style: { padding: '48px', textAlign: 'center', maxWidth: '700px', width: '100%', borderStyle: 'dashed', background: 'rgba(6,182,212,0.02)' },
      onDragOver: e => e.preventDefault(), onDrop: e => { e.preventDefault(); handleFiles(e.dataTransfer.files); } },

function formatFullLocalTime(tVal) {
  if (!tVal) return '--:--:--';
  let d = null;
  if (typeof tVal === 'number') {
    d = new Date(tVal * 1000);
  } else {
    d = new Date(tVal);
    if (isNaN(d.getTime())) {
      const m = String(tVal).match(/^(\d{4}-\d{2}-\d{2})[T\s](\d{2}:\d{2}:\d{2})/);
      if (m) {
        return m[1] + ' T-' + m[2];
      }
      return String(tVal);
    }
  }
  const pad = function(n) { return n < 10 ? '0' + n : n; };
  const dateStr = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const timeStr = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  return dateStr + ' T-' + timeStr;
}

function formatLocalTime(tSeconds) {
  const d = tSeconds ? new Date(tSeconds * 1000) : new Date();
  const pad = function(n) { return n < 10 ? '0' + n : n; };
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function App(){
  const [activeTab,setActiveTab]=useState('live');
  const [isCapturing,setIsCapturing]=useState(false);
  const [elapsed,setElapsed]=useState('00:00');
  const [logs,setLogs]=useState([]);
  const [milestones,setMilestones]=useState([]);
  const [packets,setPackets]=useState([]);
  const [profile,setProfile]=useState({}); 
  const [stats,setStats]=useState({captured:0,analyzed:0,protocols:0,sessions:0,ips:0,stun:0,turn:0,ice:0,srtp:0,rtcp:0,sip:0,sdp:0,dns:0,pps:0,bandwidth:0,latency:0,jitter:0,loss:0,rtt:0,duration:'0:00',startTime:'--:--:--'});
  const [investigationId,setInvestigationId]=useState('—');
  
  const [interfaces,setInterfaces]=useState([]);
  const [selectedIface,setSelectedIface]=useState('');
  const [bpfFilter,setBpfFilter]=useState('udp or (tcp and (port 5060 or port 5061 or port 443 or port 53 or port 5353 or port 3478))');
  const [apiKey,setApiKeyState]=useState(getKey());
  const [wsConnected,setWsConnected]=useState(false);
  const [investigations,setInvestigations]=useState([]);
  const [voipSessions,setVoipSessions]=useState([]);
  const [uploadResult,setUploadResult]=useState(null);
  const [activeIPs,setActiveIPs]=useState([]);
  const [selectedIP,setSelectedIP]=useState(null);

  const displayedActiveIPs = useMemo(function() {
    if (uploadResult && uploadResult.rows && uploadResult.rows.length > 0) {
      return uploadResult.rows.map(function(r) {
        return {
          ip: r.ip || r.destination_ip || '',
          asn: r.asn || 'AS0',
          org: r.isp || r.org || 'Local Lookup',
          city: r.city || '',
          country: r.country || '',
          state: r.state || r.region || '',
          lat: r.lat || r.latitude || 0,
          lon: r.lon || r.longitude || 0,
          isp: r.isp || ''
        };
      });
    }
    return activeIPs;
  }, [activeIPs, uploadResult]);

  const activeProfile = useMemo(function() {
    if (selectedIP) {
      const found = displayedActiveIPs.find(function(x){ return x.ip === selectedIP; });
      if (found) return found;
      if (profile && profile.ip === selectedIP) return profile;
    }
    if (uploadResult && uploadResult.summary && uploadResult.summary.remote_ip) {
      const r = uploadResult.summary;
      return {
        ip: r.remote_ip,
        city: r.remote_city || '',
        country: r.remote_country || '',
        state: r.remote_state || r.remote_region || '',
        lat: r.remote_lat || r.latitude || 0,
        lon: r.remote_lon || r.longitude || 0,
        asn: r.remote_asn || '',
        isp: r.remote_isp || '',
        org: r.remote_isp || '',
        risk: r.threat_score || 0
      };
    }
    return profile;
  }, [selectedIP, displayedActiveIPs, profile, uploadResult]);

  const displayedPackets = useMemo(function() {
    if (uploadResult && uploadResult.packet_rows && uploadResult.packet_rows.length > 0) {
      return uploadResult.packet_rows.map(function(p, i) {
        return {
          num: p.num || p.packet_index || (i + 1),
          time: p.time || p.timestamp || '',
          proto: (p.protocol || p.proto || '').toUpperCase(),
          src: p.src || ((p.source_ip || '') + (p.source_port ? ':' + p.source_port : '')),
          dst: p.dst || ((p.destination_ip || '') + (p.destination_port ? ':' + p.destination_port : '')),
          len: p.len || p.length || 0,
          info: p.info || p.summary || '',
          raw: p
        };
      });
    }
    return packets;
  }, [packets, uploadResult]);

  const displayedStats = useMemo(function() {
    if (uploadResult) {
      const p = uploadResult.packet_rows || [];
      const srtp = p.filter(function(x){ return (x.protocol || x.proto || '').toUpperCase() === 'SRTP'; }).length;
      const sip = p.filter(function(x){ return (x.protocol || x.proto || '').toUpperCase() === 'SIP'; }).length;
      const dns = p.filter(function(x){ return (x.protocol || x.proto || '').toUpperCase() === 'DNS'; }).length;
      const s = uploadResult.summary || {};
      return {
        captured: p.length,
        analyzed: p.length,
        protocols: new Set(p.map(function(x){ return (x.protocol || x.proto || '').toUpperCase(); })).size,
        sessions: (uploadResult.voip_sessions || []).length,
        ips: (uploadResult.rows || []).length,
        srtp: srtp,
        sip: sip,
        dns: dns,
        pps: 0,
        bandwidth: 0,
        duration: s.duration || '0:00',
        startTime: s.created_at ? s.created_at.split('T')[1]?.slice(0,8) : '--:--:--'
      };
    }
    return stats;
  }, [stats, uploadResult]);

  const calculatedMilestones = useMemo(function() {
    const list = Array(6).fill('pending');
    
    // Step 1: Capture Started
    if (isCapturing || uploadResult) {
      list[0] = 'complete';
    }
    
    // Step 2: Call Detection (any packets captured)
    if (packets.length > 0 || (uploadResult && uploadResult.packet_rows && uploadResult.packet_rows.length > 0)) {
      list[0] = 'complete';
      list[1] = 'complete';
    }
    
    // Step 3: VoIP Packet Interception (any STUN/SIP/RTP/SRTP packets)
    const hasVoipPackets = packets.some(function(p){ return ['SIP', 'RTP', 'SRTP', 'STUN'].includes(p.proto); }) || 
                           (uploadResult && uploadResult.packet_rows && uploadResult.packet_rows.some(function(p){ return ['SIP', 'RTP', 'SRTP', 'STUN'].includes(p.protocol || p.proto); }));
    if (hasVoipPackets || voipSessions.length > 0) {
      list[0] = 'complete';
      list[1] = 'complete';
      list[2] = 'complete';
    }
    
    // Step 4: Protocol Analysis (VoIP session detected/analyzed)
    if (!isCapturing && voipSessions.length > 0) {
      list[0] = 'complete';
      list[1] = 'complete';
      list[2] = 'complete';
      list[3] = 'complete';
    }
    
    // Step 5: IP Address Extraction (any IPs in active list)
    if (!isCapturing && activeIPs.length > 0) {
      list[0] = 'complete';
      list[1] = 'complete';
      list[2] = 'complete';
      list[3] = 'complete';
      list[4] = 'complete';
    }
    
    // Step 6: Geo-Location Mapping (main target profile or any active IP with geo resolved)
    const hasGeo = (profile && profile.ip && profile.country) || activeIPs.some(function(ip){ return ip.country; });
    if (!isCapturing && hasGeo) {
      list[0] = 'complete';
      list[1] = 'complete';
      list[2] = 'complete';
      list[3] = 'complete';
      list[4] = 'complete';
      list[5] = 'complete';
    }
    
    // If capture is active but subsequent steps are not complete, show the next pending step as 'active' (pulsing yellow)
    if (isCapturing) {
      for (let i = 0; i < 6; i++) {
        if (list[i] === 'pending') {
          list[i] = 'active';
          break;
        }
      }
    }
    
    return list;
  }, [isCapturing, uploadResult, packets, voipSessions, activeIPs, profile]);

  const timerRef=useRef(null);
  const wsRef=useRef(null);
  const wsReconRef=useRef(null);
  const startTimeRef=useRef(null);
  const seqRef=useRef(0);
  const stepRef=useRef(0);
  const resolvedIPsRef=useRef(new Set());

  // UTC clock update in header
  useEffect(()=>{
    function tick(){
      const el=document.getElementById('hdr-clock');
      if(el){
        const now=new Date();
        el.textContent=now.toISOString().split('T')[0]+' '+now.toISOString().split('T')[1].split('.')[0]+' UTC';
      }
    }
    tick();
    const id=setInterval(tick,1000);
    return ()=>clearInterval(id);
  },[]);

  // Load initial settings & integrations on mount
  useEffect(()=>{
    loadInterfaces();
    loadInvestigations();
    checkCaptureStatus();
    addLog('CyberDEEP VoIP Forensics Console initialized.', 'info', 'INFO');
    addLog('System ready — select network interface & click Start Capture.', 'info', 'INFO');
  },[]);

  async function checkCaptureStatus() {
    try {
      const statsData = await api('/api/capture/status');
      if (statsData.is_capturing) {
        setIsCapturing(true);
        setInvestigationId(statsData.session_id || '—');
        
        // Load initial stats
        const sec = statsData.elapsed_seconds || 0;
        const mins = Math.floor(sec/60).toString().padStart(2,'0');
        const secs = (sec%60).toString().padStart(2,'0');
        setElapsed(mins+':'+secs);

        setStats(prev => ({
          ...prev,
          captured: statsData.packet_count || 0,
          pps: statsData.pps || 0,
          duration: mins+':'+secs,
          startTime: new Date(Date.now() - (statsData.elapsed_seconds || 0) * 1000).toISOString().split('T')[1].split('.')[0]
        }));

        // Automatically connect WS
        try {
          const ticketData = await api('/api/auth/ticket', { method: 'POST' });
          connectWS(ticketData.ticket);
        } catch (wsErr) {}

        // Resume elapsed timer
        startTimeRef.current = Date.now() - (statsData.elapsed_seconds || 0) * 1000;
        timerRef.current = setInterval(function(){
          const s = Math.floor((Date.now()-startTimeRef.current)/1000);
          const mStr = Math.floor(s/60).toString().padStart(2,'0');
          const sStr = (s%60).toString().padStart(2,'0');
          setElapsed(mStr+':'+sStr);
          setStats(prev => ({...prev, duration: mStr+':'+sStr}));
        }, 1000);
      }
    } catch(e) {}
  }

  async function loadInterfaces(isManual=false) {
    try {
      const d = await api('/api/interfaces');
      const arr = d.interfaces || [];
      setInterfaces(arr);
      if(arr.length) {
        const first = arr[0];
        setSelectedIface(typeof first === 'object' && first ? (first.id || first.name) : first);
      }
      if (isManual) {
        toast('Network interfaces re-scanned successfully!', 'success');
      }
    } catch(e) {
      setInterfaces([]);
      setSelectedIface('');
      toast('Failed to load interfaces: ' + e.message, 'error');
    }
  }



  async function loadInvestigations() {
    try {
      const d = await api('/api/investigations');
      setInvestigations(Array.isArray(d) ? d : []);
    } catch(e) {}
  }

  const addLog=useCallback(function(message,type,level){
    type=type||'info';level=level||'INFO';
    const time=formatLocalTime();
    setLogs(function(prev){return prev.slice(-100).concat([{time,message,type,level}]);});
  },[]);

  function advanceMilestone(){
    const step = stepRef.current;
    if(step>=MILESTONES.length) return;
    setMilestones(function(prev){
      const next=[...prev];
      while(next.length<MILESTONES.length) next.push('pending');
      next[step]='active';
      return next;
    });
    setTimeout(function(){
      setMilestones(function(prev){
        const next=[...prev];
        while(next.length<MILESTONES.length) next.push('pending');
        next[step]='complete';
        return next;
      });
    },800);
    addLog(MILESTONES[step].title,'info',MILESTONES[step].type==='warn'?'WARN':'INFO');
    stepRef.current = step+1;
  }

  // Handle incoming WS packets and statistics
  function handleWsMessage(msg){
    if(!msg||!msg.type) return;

    if(msg.type==='packet'){
      const ts = msg.timestamp ? new Date(msg.timestamp*1000).toISOString().split('T')[1]?.split('.')[0]||'' : new Date().toISOString().split('T')[1].split('.')[0];
      const proto = (msg.protocol || '').toUpperCase();
      const pkt = {
        num: ++seqRef.current,
        time: ts,
        proto: proto,
        src: (msg.source_ip||'')+(msg.source_port?':'+msg.source_port:''),
        dst: (msg.destination_ip||'')+(msg.destination_port?':'+msg.destination_port:''),
        len: msg.length||0,
        info: msg.summary||msg.payload_preview||'',
        source_ip: msg.source_ip,
        destination_ip: msg.destination_ip,
        source_port: msg.source_port,
        destination_port: msg.destination_port,
        protocol: msg.protocol,
        length: msg.length,
        timestamp: msg.timestamp
      };
      setPackets(function(prev){ return prev.concat(pkt).slice(-200); });
      setStats(function(prev){
        return {
          ...prev,
          captured: prev.captured+1,
          analyzed: prev.analyzed+1,
          srtp: prev.srtp+(proto==='SRTP'?1:0),
          rtcp: prev.rtcp+(proto==='RTCP'?1:0),
          stun: prev.stun+(proto==='STUN'?1:0),
          sip: prev.sip+(proto==='SIP'?1:0),
          dns: prev.dns+(proto==='DNS'?1:0)
        };
      });

      if (['SIP', 'RTP', 'SRTP', 'STUN'].includes(proto)) {
        const flowId = msg.flow_id || (msg.source_ip + '-' + msg.destination_ip);
        const isRelayed = proto === 'STUN' || proto === 'TURN' || (msg.source_port === 3478 || msg.destination_port === 3478);
        const typeStr = isRelayed ? 'RELAY' : 'P2P';
        const s = {
          session_id: flowId,
          caller: msg.source_ip || '',
          callee: msg.destination_ip || '',
          protocol: proto,
          jitter_ms: msg.jitter || 0.12,
          mos_score: msg.mos || 4.38,
          media_path: proto,
          connection_type: typeStr,
          timestamp: msg.timestamp || (Date.now() / 1000),
          status: isRelayed 
            ? '[RELAY] ' + (msg.source_ip || '') + ' → [SERVER] → ' + (msg.destination_ip || '')
            : '[P2P] ' + (msg.source_ip || '') + ' ⟷ ' + (msg.destination_ip || '')
        };
        setVoipSessions(function(prev) {
          const idx = prev.findIndex(function(x){ return x.session_id === s.session_id; });
          if(idx>=0){ const next=[...prev]; next[idx]=s; return next; }
          return [...prev, s];
        });
      }

      const isPub = function(ipStr) {
        if (!ipStr) return false;
        return !(ipStr.startsWith('192.168.') || ipStr.startsWith('10.') || ipStr.startsWith('127.') || ipStr.startsWith('172.16.') || ipStr.startsWith('169.254.') || ipStr.startsWith('::1') || ipStr.startsWith('fe80:'));
      };

      const targetIP = isPub(msg.destination_ip) ? msg.destination_ip : (isPub(msg.source_ip) ? msg.source_ip : null);

      if (targetIP) {
        setActiveIPs(function(prev) {
          if (prev.some(function(x){ return x.ip === targetIP; })) return prev;
          return prev.concat([{
            ip: targetIP,
            asn: 'Resolving...',
            org: 'Live Packet Target',
            city: '',
            country: '',
            state: '',
            lat: 0,
            lon: 0,
            isp: 'Resolving...'
          }]);
        });

        setProfile(function(p) {
          if (p.ip && p.isVoip && p.ip !== targetIP) return p;
          return {
            ip: targetIP,
            city: p.ip === targetIP ? p.city : '',
            country: p.ip === targetIP ? p.country : '',
            state: p.ip === targetIP ? p.state : '',
            lat: p.ip === targetIP ? p.lat : 0,
            lon: p.ip === targetIP ? p.lon : 0,
            asn: p.ip === targetIP ? p.asn : 'Resolving...',
            isp: p.ip === targetIP ? p.isp : 'Resolving...',
            org: p.ip === targetIP ? p.org : 'Live Packet Target',
            risk: p.ip === targetIP ? p.risk : 0,
            isVoip: true
          };
        });

        // Trigger immediate automatic background lookup using our telecom API & offline ASN fallback engine
        if (!resolvedIPsRef.current.has(targetIP)) {
          resolvedIPsRef.current.add(targetIP);
          api('/api/geoip/lookup?ip=' + encodeURIComponent(targetIP)).then(function(g) {
            if (g && g.status === 'success') {
              const rawAsn = g.as || g.asn || 'AS0';
              const cleanAsn = rawAsn.replace(/^AS/i, '').trim() || '—';
              const resolvedOrg = g.org || g.isp || g.asname || 'Resolved Target';
              const resolvedIsp = g.isp || g.org || g.asname || '';

              setActiveIPs(function(prev) {
                const idx = prev.findIndex(function(x){ return x.ip === targetIP; });
                const entry = {
                  ip: targetIP,
                  asn: cleanAsn,
                  org: resolvedOrg,
                  city: g.city || '',
                  country: g.country || '',
                  state: g.regionName || g.region || '',
                  lat: g.lat || g.latitude || 0,
                  lon: g.lon || g.longitude || 0,
                  isp: resolvedIsp
                };
                if (idx >= 0) { const next = [...prev]; next[idx] = entry; return next; }
                return [...prev, entry];
              });

              setProfile(function(p) {
                if (p.ip && p.isVoip && p.ip !== targetIP) return p;
                return {
                  ip: targetIP,
                  city: g.city || '',
                  country: g.country || '',
                  state: g.regionName || g.region || '',
                  lat: g.lat || g.latitude || 0,
                  lon: g.lon || g.longitude || 0,
                  asn: cleanAsn,
                  isp: resolvedIsp,
                  org: resolvedOrg,
                  risk: 0,
                  isVoip: true
                };
              });
            }
          }).catch(function(){});
        }

        if(stepRef.current===4) advanceMilestone(); // step 5: IP Extraction
        if(stepRef.current===5) advanceMilestone(); // step 6: Geo Mapping
      }

      if(stepRef.current===1 && (proto==='STUN'||proto==='SIP'||proto==='RTP'||proto==='SRTP')){
        advanceMilestone(); // step 2: Call Detection
      }
      if(stepRef.current===2 && (proto==='SRTP'||proto==='RTP')){
        advanceMilestone(); // step 3: VoIP Packet Interception
      }
    }

    if(msg.type==='enrichment'&&msg.ip){
      const ip = msg.ip;
      const g = msg.geoip || {};
      const t = msg.threat || {};
      
      setActiveIPs(prev => {
        const idx = prev.findIndex(x => x.ip === ip);
        const resolvedOrg = g.asn_org || g.isp || g.org || 'Local Lookup';
        const resolvedIsp = g.isp || g.asn_org || g.org || '';
        const rawAsn = g.asn || 'AS0';
        const cleanAsn = rawAsn.replace(/^AS/i, '').trim() || '—';
        const entry = {
          ip: ip,
          asn: cleanAsn,
          org: resolvedOrg,
          city: g.city || '',
          country: g.country || '',
          state: g.region || '',
          lat: g.latitude || 0,
          lon: g.longitude || 0,
          isp: resolvedIsp
        };
        if(idx>=0){ const next=[...prev]; next[idx]=entry; return next; }
        return [...prev, entry];
      });

      const isPrivate=ip.startsWith('192.168.')||ip.startsWith('10.')||ip.startsWith('127.')||ip.startsWith('172.16.')||ip.startsWith('169.254.')||ip.startsWith('::1');
      if(!isPrivate){
        setProfile(p => {
          if(p.ip && p.isVoip && p.ip !== ip) return p;
          const resolvedOrg = g.asn_org || g.isp || g.org || '';
          const resolvedIsp = g.isp || g.asn_org || g.org || '';
          return {
            ip: ip,
            city: g.city || '',
            country: g.country || '',
            state: g.region || '',
            lat: g.latitude || 0,
            lon: g.longitude || 0,
            asn: g.asn || '',
            isp: resolvedIsp,
            org: resolvedOrg,
            risk: t.risk_score || t.score || 0,
            isVoip: p.isVoip || false
          };
        });
        if(stepRef.current===4) advanceMilestone(); // step 5: IP Extraction
        if(stepRef.current===5) advanceMilestone(); // step 6: Geo Mapping
        addLog('Enriched: '+ip+' → '+(g.city||'')+(g.country?' '+g.country:'')+(msg.classification?' ['+msg.classification+']':''),'info','INFO');
      }
    }

    if(msg.type==='alert'){
      const alertObj = msg.alert || {};
      const alertMsg = alertObj.description || alertObj.message || JSON.stringify(msg.alert || msg.data || {});
      addLog('⚠ [' + (alertObj.category || 'ALERT') + '] ' + alertMsg, 'warn', 'WARN');
    }

    if(msg.type==='stats'){
      setStats(prev => ({
        ...prev,
        captured: msg.packet_count || prev.captured,
        pps: msg.pps || prev.pps,
        bandwidth: msg.bandwidth_kbps || prev.bandwidth,
        sessions: msg.session_count || prev.sessions,
        protocols: msg.protocol_count || prev.protocols
      }));
    }

    if(msg.type==='flow'||msg.type==='voip'){
      const s = {
        session_id: msg.call_id || msg.flow_id || ('ws-'+Date.now()),
        caller: msg.caller || msg.source_ip || '',
        callee: msg.callee || msg.destination_ip || '',
        protocol: msg.call_type || msg.protocol || 'VoIP',
        jitter_ms: msg.jitter || 0,
        mos_score: msg.mos || 0,
        media_path: msg.media_path || '',
        status: msg.status || ('[CALLER] ' + (msg.caller || '') + ' → [RELAY] ' + (msg.callee || ''))
      };
      setVoipSessions(prev => {
        const idx = prev.findIndex(x => x.session_id === s.session_id);
        if(idx>=0){ const next=[...prev]; next[idx]=s; return next; }
        return [...prev, s];
      });

      const callerIP = msg.caller || msg.source_ip || '';
      const calleeIP = msg.callee || msg.destination_ip || '';
      const isPub = function(ip) {
        if(!ip) return false;
        return !(ip.startsWith('192.168.')||ip.startsWith('10.')||ip.startsWith('127.')||ip.startsWith('172.16.')||ip.startsWith('169.254.')||ip.startsWith('::1'));
      };
      let targetIP = '';
      if(isPub(calleeIP)) targetIP = calleeIP;
      else if(isPub(callerIP)) targetIP = callerIP;

      if(targetIP){
        setProfile(p => {
          if(p.ip === targetIP && p.isVoip) return p;
          return {
            ip: targetIP,
            city: p.ip === targetIP ? p.city : '',
            country: p.ip === targetIP ? p.country : '',
            state: p.ip === targetIP ? p.state : '',
            lat: p.ip === targetIP ? p.lat : 0,
            lon: p.ip === targetIP ? p.lon : 0,
            asn: p.ip === targetIP ? p.asn : '',
            isp: p.ip === targetIP ? p.isp : '',
            org: p.ip === targetIP ? p.org : '',
            risk: p.ip === targetIP ? p.risk : 0,
            isVoip: true
          };
        });
      }

      if(stepRef.current===3) advanceMilestone(); // step 4: Protocol Analysis
    }

    if(msg.type==='voip_update' && msg.session){
      const sess = msg.session;
      const isRelayed = sess.turn_allocations?.length > 0 || (sess.turn_servers && sess.turn_servers.length > 0);
      const typeStr = isRelayed ? 'RELAY' : 'P2P';
      
      let routeStr = '';
      if (sess.turn_allocations && sess.turn_allocations.length > 0) {
        const a = sess.turn_allocations[0];
        routeStr = '[CLIENT] ' + a.client + ' → [RELAY] ' + a.relay;
      } else {
        routeStr = sess.caller_ip + ' ⟷ ' + sess.callee_ip;
      }
      
      const s = {
        session_id: sess.call_id || ('ws-'+Date.now()),
        caller: sess.caller_ip || 'Unknown',
        callee: sess.callee_ip || 'Unknown',
        protocol: sess.media_path || 'VoIP',
        jitter_ms: sess.jitter || 0,
        mos_score: sess.mos || 0,
        mos_label: sess.mos_label || 'Excellent',
        connection_type: typeStr,
        timestamp: sess.start_time || (Date.now() / 1000),
        status: sess.ice_state ? ('ICE state: ' + sess.ice_state + ' | ' + routeStr) : routeStr,
        
        // Save advanced tracking metrics on the session object
        ice_state: sess.ice_state,
        nominated_pair: sess.nominated_pair,
        turn_allocations: sess.turn_allocations,
        extracted_ips: sess.extracted_ips,
        confidence_score: sess.confidence_score,
        confidence_tier: sess.confidence_tier,
        warnings: sess.warnings
      };
      
      setVoipSessions(prev => {
        const idx = prev.findIndex(x => x.session_id === s.session_id);
        if(idx>=0){ const next=[...prev]; next[idx]=s; return next; }
        return [...prev, s];
      });

      const callerIP = sess.caller_ip || '';
      const calleeIP = sess.callee_ip || '';
      const isPub = function(ip) {
        if(!ip) return false;
        return !(ip.startsWith('192.168.')||ip.startsWith('10.')||ip.startsWith('127.')||ip.startsWith('172.16.')||ip.startsWith('169.254.')||ip.startsWith('::1'));
      };
      let targetIP = '';
      if(isPub(calleeIP)) targetIP = calleeIP;
      else if(isPub(callerIP)) targetIP = callerIP;

      if(targetIP){
        setProfile(p => {
          if(p.ip === targetIP && p.isVoip) return p;
          return {
            ip: targetIP,
            city: p.ip === targetIP ? p.city : '',
            country: p.ip === targetIP ? p.country : '',
            state: p.ip === targetIP ? p.state : '',
            lat: p.ip === targetIP ? p.lat : 0,
            lon: p.ip === targetIP ? p.lon : 0,
            asn: p.ip === targetIP ? p.asn : '',
            isp: p.ip === targetIP ? p.isp : '',
            org: p.ip === targetIP ? p.org : '',
            risk: p.ip === targetIP ? p.risk : 0,
            isVoip: true
          };
        });
      }
      if(stepRef.current===3) advanceMilestone(); // step 4: Protocol Analysis
    }

    if(msg.type==='capture_report' && msg.report){
      const rep = msg.report;
      addLog('Capture report received for session: ' + rep.session_id, 'success', 'INFO');
      if (Array.isArray(rep.extracted_ips)) {
        rep.extracted_ips.forEach(function(e) {
          if (e.ip) {
            setActiveIPs(prev => {
              if (prev.some(x => x.ip === e.ip)) return prev;
              return [...prev, {
                ip: e.ip,
                asn: 'AS0',
                org: e.source || 'Capture Report',
                city: '',
                country: '',
                state: '',
                lat: 0,
                lon: 0,
                isp: ''
              }];
            });
          }
        });
      }
    }

    if(msg.type==='log'){
      addLog(msg.message||String(msg.data),'info','INFO');
    }
  }

  function connectWS(ticket){
    const wsUrl = (window.location.protocol==='https:'?'wss:':'ws:')+'//'+ window.location.host+'/api/capture/live?ticket='+ticket;
    const ws = new WebSocket(wsUrl);
    wsRef.current = ws;

    ws.onopen = function(){
      setWsConnected(true);
      addLog('WebSocket connected to live data feed','success','INFO');
      ws.send(JSON.stringify({action:'sync'}));
    };

    ws.onmessage = function(event){
      try {
        const msg = JSON.parse(event.data);
        if(msg.type==='batch' && Array.isArray(msg.data)){
          msg.data.forEach(handleWsMessage);
        } else {
          handleWsMessage(msg);
        }
      } catch(e){}
    };

    ws.onerror = function(){ addLog('WebSocket protocol error','warn','WARN'); };

    ws.onclose = function(){
      setWsConnected(false);
      if(isCapturing){
        addLog('WebSocket stream disconnected — trying reconnection…','warn','WARN');
        wsReconRef.current = setTimeout(async function(){
          try {
            const ticketData = await api('/api/auth/ticket',{method:'POST'});
            connectWS(ticketData.ticket);
          } catch(e){ addLog('Reconnection failed: '+e.message,'warn','WARN'); }
        },3000);
      }
    };
  }

  async function startCapture() {
    if(!getKey()){
      toast('No API key set — please save your API key in Settings first.','error');
      setActiveTab('settings');
      return;
    }
    try {
      await api('/api/capture/start',{
        method:'POST',
        body:JSON.stringify({interface:selectedIface,filter_expr:bpfFilter,promiscuous:true})
      });

      const ticketData = await api('/api/auth/ticket',{method:'POST'});

      seqRef.current=0;
      stepRef.current=0;
      setIsCapturing(true);
      setLogs([]);
      setMilestones([]);
      setPackets([]);
      setVoipSessions([]);
      setActiveIPs([]);
      setUploadResult(null);
      setProfile({});
      
      let realId = 'live_' + Math.floor(Date.now() / 1000);
      try {
        const statsData = await api('/api/capture/status');
        if(statsData.session_id) realId = statsData.session_id;
      } catch(statusErr) {}
      setInvestigationId(realId);
      
      startTimeRef.current=Date.now();
      const startStr = new Date().toISOString().split('T')[1].split('.')[0];
      setStats({captured:0,analyzed:0,protocols:0,sessions:0,ips:0,stun:0,turn:0,ice:0,srtp:0,rtcp:0,sip:0,sdp:0,dns:0,pps:0,bandwidth:0,latency:0,jitter:0,loss:0,rtt:0,duration:'0:00',startTime:startStr});
      setActiveTab('live');

      addLog('Capture initialized on '+selectedIface,'info','INFO');
      advanceMilestone();

      connectWS(ticketData.ticket);

      timerRef.current=setInterval(function(){
        const sec=Math.floor((Date.now()-startTimeRef.current)/1000);
        const mins=Math.floor(sec/60).toString().padStart(2,'0');
        const secs=(sec%60).toString().padStart(2,'0');
        setElapsed(mins+':'+secs);
        setStats(prev => ({...prev, duration: mins+':'+secs}));
      },1000);

      toast('Live capture active on '+selectedIface,'success');
    } catch(e){
      toast('Start failed: '+e.message,'error');
      if (timerRef.current) clearInterval(timerRef.current);
      if (wsRef.current) wsRef.current.close();
      setIsCapturing(false);
      setElapsed('0:00');
      addLog('Capture stopped','warn','WARN');
    }
  }

  const restartServer = async function() {
    try {
      addLog('Restarting server engines...', 'warn', 'WARN');
      const res = await api('/api/system/restart', { method: 'POST' });
      if (res.capturing_resumed) {
        setIsCapturing(true);
        addLog('Server restarted & live capture automatically resumed', 'success', 'INFO');
        toast('Server refreshed — Capture resumed!', 'success');
      } else {
        if (isCapturing) {
          if (timerRef.current) clearInterval(timerRef.current);
          if (wsRef.current) wsRef.current.close();
          setIsCapturing(false);
          setElapsed('0:00');
        }
        addLog('Server engines restarted successfully', 'success', 'INFO');
        toast('Server refreshed successfully', 'success');
      }
    } catch(err) {
      addLog('Server restart failed: ' + err.message, 'error', 'ERROR');
      toast('Failed to restart server: ' + err.message, 'error');
    }
  };

  async function stopCapture() {
    try { await api('/api/capture/stop',{method:'POST'}); } catch(e){}
    setIsCapturing(false);
    if(timerRef.current){ clearInterval(timerRef.current); timerRef.current=null; }
    if(wsRef.current){ wsRef.current.close(); wsRef.current=null; }
    if(wsReconRef.current){ clearTimeout(wsReconRef.current); }
    setWsConnected(false);
    addLog('Capture session terminated.','success','INFO');
    toast('Capture stopped','success');
    loadInvestigations();
  }

  function toggleCapture() {
    if(isCapturing) stopCapture();
    else startCapture();
  }

  async function downloadPcap() {
    if (!investigationId || investigationId === '—') {
      toast('No active capture session to download.', 'error');
      return;
    }
    try {
      const blob = await apiBlob('/api/capture/export?format=pcap');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'capture_' + investigationId + '.pcap';
      a.click();
      toast('PCAP file downloaded successfully', 'success');
    } catch(e) {
      toast('Download failed: ' + e.message, 'error');
    }
  }

  async function saveLiveCapture() {
    const title=prompt('Enter title for this investigation:','Live Capture '+investigationId);
    if(!title) return;
    try {
      const data = await api('/api/capture/promote?title='+encodeURIComponent(title),{method:'POST'});
      toast('Investigation persisted: '+data.id,'success');
      addLog('Investigation saved successfully: '+data.id,'success','INFO');
      loadInvestigations();
    } catch(e){ toast('Save failed: '+e.message,'error'); }
  }

  async function loadInvestigation(id) {
    try {
      const data = await api('/api/investigations/'+id);
      setUploadResult(data);
      const voip = (data.correlation && data.correlation.voip_sessions) || data.voip_sessions || [];
      if(voip.length) setVoipSessions(voip);
      setInvestigationId(id);
      
      const time = formatLocalTime();
      const logEntries = [
        { time: time, message: 'Investigation #' + id.slice(0, 8) + ' loaded successfully.', type: 'success', level: 'INFO' },
        { time: time, message: 'Forensics: loaded ' + (data.packet_rows?.length || 0) + ' packets.', type: 'info', level: 'INFO' },
        { time: time, message: 'Forensics: loaded ' + (data.rows?.length || 0) + ' destination target IPs.', type: 'info', level: 'INFO' },
        { time: time, message: 'Forensics: mapped ' + voip.length + ' VoIP call dialogs.', type: 'success', level: 'INFO' }
      ];
      setLogs(function(prev){ return prev.concat(logEntries); });
      toast('Session '+id.slice(0,8)+' loaded','success');
      setActiveTab('live');
    } catch(e){ toast('Failed to load session: '+e.message,'error'); }
  }

  function handleUploadResult(data) {
    setUploadResult(data);
    const voip = (data.correlation && data.correlation.voip_sessions) || data.voip_sessions || [];
    if(voip.length) setVoipSessions(voip);
    if(data.id) setInvestigationId(data.id);

    const time = formatLocalTime();
    const logEntries = [
      { time: time, message: 'PCAP upload forensic trace imported: ' + (data.filename || 'capture.pcap'), type: 'success', level: 'INFO' },
      { time: time, message: 'Forensics: decoded ' + (data.packet_rows?.length || 0) + ' packets.', type: 'info', level: 'INFO' },
      { time: time, message: 'Forensics: resolved ' + (data.rows?.length || 0) + ' destination target IPs.', type: 'info', level: 'INFO' },
      { time: time, message: 'Forensics: mapped ' + voip.length + ' VoIP call dialogs.', type: 'success', level: 'INFO' }
    ];
    setLogs(function(prev){ return prev.concat(logEntries); });
    toast('PCAP parsed and loaded successfully!', 'success');
    setActiveTab('live');
  }

  function handleSaveApiKey(k) {
    setKey(k);
    setApiKeyState(k);
    setTimeout(function(){
      loadInterfaces();
      loadInvestigations();
    }, 100);
  }

  function renderContent(){
    switch(activeTab){
      case 'decoder': 
        return h(PacketDecoderPage, { packets, uploadResult });
      case 'upload': 
        return h(UploadPage, { onUploadResult: handleUploadResult });
      case 'reports':
        return h(ReportsPage, { investigations, currentInvId: investigationId });
      case 'settings':
        return h(SettingsPage, { apiKey, onSave: handleSaveApiKey, wsConnected });
      case 'voip':
        return h(VoIPAnalyzerPage, { sessions: voipSessions, uploadResult, packets: displayedPackets });
      case 'geoip': 
        return h(GeoIPPage, { profile: activeProfile, activeIPs: displayedActiveIPs, selectedIP: selectedIP, setSelectedIP: setSelectedIP });
      case 'live':
      default:
        return h('div',{},
          h('div',{style:{marginBottom:'20px'}},
            h('div',{style:{display:'flex',alignItems:'center',gap:'12px',marginBottom:'4px'}},h(IconActivity),h('h1',{style:{fontSize:'16px',fontWeight:600,letterSpacing:'2px',textTransform:'uppercase',fontFamily:'var(--font-mono)'}},'Real-Time Investigation Workspace')),
            h('div',{style:{fontSize:'11px',color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'3px',marginLeft:'28px'}},'Unified Capture · Parse · Attribute · Geo · Intel')
          ),
          h(StatusCards,{milestones: calculatedMilestones}),
          h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',marginBottom:'16px'}},
            h(TerminalLog,{logs}),
            h(GeoPanel,{profile: activeProfile, isCapturing: isCapturing})
          ),
          h('div',{style:{marginBottom:'16px',height:'280px'}},
            h(ASNMapper, { profile: activeProfile, activeIPs: displayedActiveIPs, selectedIP: selectedIP, setSelectedIP: setSelectedIP })
          ),
          h(PacketViewer,{packets: displayedPackets}),
          h(InvestigationSummary,{profile: activeProfile, stats: displayedStats, investigationId: investigationId, isCapturing: isCapturing, onPromote: saveLiveCapture})
        );
    }
  }

  return h('div',{style:{display:'flex',flexDirection:'column',height:'100vh',background:'var(--bg-primary)'},className:'cyber-grid'},
    h(Header,{isCapturing,onToggle:toggleCapture,elapsed,investigationId,interfaces,selectedIface,onIfaceChange:setSelectedIface,bpfFilter,onBpfChange:setBpfFilter,onRefreshInterfaces:()=>loadInterfaces(true),onDownloadPcap:downloadPcap,onRestartServer:restartServer}),
    h('div',{style:{display:'flex',flex:1,overflow:'hidden'}},
      h(Sidebar,{activeTab,setActiveTab,isCapturing}),
      h('main',{style:{flex:1,overflow:'auto',padding:'20px'}},
        renderContent(),
        h('div',{style:{textAlign:'center',padding:'20px',fontSize:'11px',color:'var(--text-muted)',fontFamily:'var(--font-mono)',textTransform:'uppercase',letterSpacing:'2px'}},'DeepLive VOIP Capture · Military-Grade Forensic Console')
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
