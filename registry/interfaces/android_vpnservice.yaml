id: android_vpnservice
display_name: "Android VPN Interface"
role_on_match: VPN_INTERFACE
icon: vpn-tunnel
color: "#7A7F8C"
address_spaces:
  - "10.215.173.0/24"

capture_source_hints:
  - PCAPdroid
  - "Android VpnService"

conditions:
  - id: rfc1918_pair
    weight: 0.20
    test: both_endpoints_rfc1918

  - id: dominant_pair_traffic
    weight: 0.25
    test: traffic_concentration_between_pair
    threshold: 0.95

  - id: dns_contained
    weight: 0.15
    test: dns_queries_only_between_pair

  - id: stun_turn_originates_from_pair
    weight: 0.15
    test: stun_turn_source_is_pair

  - id: no_link_layer_evidence
    weight: 0.15
    test: no_arp_no_mac_no_route_advertisement

  - id: capture_source_match
    weight: 0.10
    test: capture_metadata_matches_hints
